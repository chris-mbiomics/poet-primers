name: Build binaries

# Standalone POET binaries: Linux AppImage, Windows .exe, macOS .dmg.
# Tags v* also publish them as a GitHub Release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04 # oldest supported glibc -> widest AppImage compatibility
          - os: windows-latest
          - os: macos-14 # Apple silicon
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xinerama0 libxcb-xkb1 libnss3 libxcomposite1 libxdamage1 libxrandr2 \
            libxtst6 libxkbfile1 libasound2 libdbus-1-3 libfontconfig1

      - name: Install POET and build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[server,desktop,bundle]"

      - name: Build
        run: python packaging/build.py

      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        run: |
          app=$(ls dist/poet-primers-*.AppImage)
          "$app" --appimage-extract-and-run --version
          "$app" --appimage-extract-and-run analyse GAGAATGTGGGCTCTCAAGC GGCGTTAGTTTAAGTCACGG

      - name: Smoke test (macOS)
        if: runner.os == 'macOS'
        run: |
          dist/pyinstaller/POET.app/Contents/MacOS/poet-primers --version
          dist/pyinstaller/POET.app/Contents/MacOS/poet-primers analyse GAGAATGTGGGCTCTCAAGC GGCGTTAGTTTAAGTCACGG

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $app = (Get-ChildItem dist/poet-primers-*.exe).FullName
          & $app --version
          & $app analyse GAGAATGTGGGCTCTCAAGC GGCGTTAGTTTAAGTCACGG
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: poet-primers-${{ runner.os }}
          path: |
            dist/poet-primers-*.AppImage
            dist/poet-primers-*.exe
            dist/poet-primers-*.dmg
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
