[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "poet-primers"
version = "2.0.2"
description = "POET (Primer & Oligo Evaluation Toolkit): primer design for PCR, bisulphite PCR, real-time PCR and sequencing, multiplex dimer screening and degenerate primers; started as a Python port of PerlPrimer"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-2.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Christian Romberg", email = "c.romberg@tum.de" }]
keywords = ["primer design", "PCR", "qPCR", "bisulphite", "oligo", "multiplex", "bioinformatics"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Framework :: Flask",
]
dependencies = ["flask>=3.0"]

[project.optional-dependencies]
server = ["waitress>=3.0"]
desktop = ["pywebview>=5.0"]
# Freezing into a standalone binary (python packaging/build.py); Linux bundles Qt WebEngine.
bundle = ["pyinstaller>=6.10", "pywebview[qt]>=5.0; sys_platform == 'linux'"]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
poet-primers = "poet_primers.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
poet_primers = ["data/*", "web/templates/*", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/poet_primers"]

[[tool.mypy.overrides]]
module = ["waitress", "webview"]
ignore_missing_imports = true
